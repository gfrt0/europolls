# Full party names by country, keyed by the canonical party_short used
# elsewhere in the pipeline. Format: native name with English gloss in
# parens where the abbreviation isn't self-evident. Used for hover
# tooltips on table cells, plot toggle chips, and wide-table headers.
#
# Long-tail parties without an entry fall through to showing the
# party_short as-is (no tooltip). Keep this file focused on the
# politically active parties — exhaustive coverage isn't necessary.

