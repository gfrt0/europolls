# Portugal — PSD/CDS pre-election coalition; leader-tagged and cabinet-
# approval columns dropped (they're satisfaction polling, not vote intention).

aliases:
  "PSD/CDS":      "PSD–CDS"           # 2015 pre-electoral PSD+CDS coalition
  "PSD/CDSIL":    "PSD–CDS–IL"        # three-party simulation
  "CDS–PP":       "Democratic and Social Center / People's Party"
  "PassosCoelho": "Popular Democratic Party / Social Democratic Party"
  "JoséSócrates": "Socialist Party"
  "FerreiraLeite": "Popular Democratic Party / Social Democratic Party"

drop_regex:
  - "'s cabinet$"           # 'António Costa's cabinet', etc. — approval polls
  - "^Both"                 # 'Both', 'Both/O|Other' — approval-poll bucket
  - "Debate com"            # Wikipedia image-caption junk leaked into a header

drop:
  - "António Costa"
  - "Luís Montenegro"
  - "André Ventura"
  - "Rui Rio"
  - "Inês Sousa Real"
  - "Nuno Melo"
  - "Paulo Raimundo"
  - "Rui Tavares"
  - "Pedro Passos Coelho"
  - "Catarina Martins"
  - "Pedro Nuno Santos"
  - "Mariana Mortágua"
  - "Pedro Santana Lopes"
  - "José Luís Carneiro"
  - "Marta Temido"
  - "Fernando Medina"
  - "Duarte Cordeiro"
  - "Élvio Sousa"
  - "Costa"
  - "Seguro"
