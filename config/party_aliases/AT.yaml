# Austria — party_short variant → canonical mapping for the web view.
#
# Wikipedia interleaves abbreviations (ÖVP, SPÖ) with full English names
# ("Austrian People's Party") and leader+party concatenations ("KurzÖVP",
# "Rendi-Wagner/KernSPÖ"). This file folds the obvious ones; leader-tagged
# columns from satisfaction polls are intentionally left alone.

aliases:
  "Austrian People's Party":        "Austrian People's Party"
  "Social Democratic Party of Austria": "Social Democratic Party of Austria"
  "Freedom Party of Austria":       "Freedom Party of Austria"
  "The Greens (Austria)":           "The Greens — The Green Alternative"
  "NEOS (Austria)":                 "NEOS — The New Austria"
  "Communist Party of Austria":     "Communist Party of Austria"

# Leader+party concatenations from chancellor-preference satisfaction polls
# (e.g. 'KurzÖVP' = Kurz-as-candidate via the ÖVP). Distinct from voting
# intention; drop from the long-table / chart.
drop:
  - "KurzÖVP"
  - "Rendi-Wagner/KernSPÖ"
  - "Hofer/StracheFPÖ"
  - "KoglerGrüne"
  - "Meinl-Reisinger/StrolzNEOS"
  - "Rendi-WagnerSPÖ"
  - "Meinl-ReisingerNEOS"
  - "HoferFPÖ"
  - "StracheHC"
  - "Other/None"
