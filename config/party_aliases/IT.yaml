# Italy — Wikipedia uses both 'Lega' (post-2018 brand) and 'LN' (Lega Nord);
# same party. UdC has multiple casings. UDC = UdC. 2013-era full English
# labels ("Five Star Movement", "Italy. Common Good") are folded into the
# successor short codes for cross-cycle continuity.
# (For partyfacts_id harmonization see config/party_mappings/IT.yaml.)
#
# Deliberately NOT folded:
#   FI vs PdL — Forza Italia (pre-2009, post-2013) and Popolo della Libertà
#               (2009-2013) are legally distinct parties with separate
#               partyfacts ids, even though both centre on Berlusconi's
#               coalition. Wikipedia treats them separately; we keep them
#               separate too. Toggle PdL on with FI to see the combined
#               vote share visually.
#   PdL/FI    — Wikipedia's 2013 transition-period column. Could be folded
#               into FI, but it captures a genuine cross-table ambiguity;
#               kept as its own label for now.

aliases:
  "LN":                    "North League"
  "UDC":                   "Union of Christian and Centre Democrats"
  "Five Star Movement":    "Five Star Movement"
  "Italy. Common Good":    "Democratic Party"           # 2013 Bersani PD-led list
  "Ulivo/PD":              "Democratic Party"           # 2007-08 Olive Tree → PD transition
  "Ulivo":                 "Democratic Party"           # Olive Tree (1995-2007) predecessor
  "With Monti for Italy":  "Civic Choice"           # 2013 Monti list = Civic Choice
  "Civil Revolution":      "Civil Revolution"           # 2013 Ingroia list (partyfacts 2277)
  "SEL/SI":                "Italian Left"           # SEL→SI transition pair
  "Centre-right coalition": "Centre-right Coalition"          # alt label for the CDX coalition
  "Centre-right":          "Centre-right Coalition"
  "Centre-left":           "Centre-left coalition"
  "casa delle libertà":    "House of Freedom"           # 2001-2008 Berlusconi coalition
