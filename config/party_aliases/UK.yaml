# United Kingdom — Greens appear as Grn / Green; Reform/Brexit/RB are the
# same successor party (Brexit Party → Reform UK in 2021).

aliases:
  "Green":  "Grn"
  "RB":     "Brx"
  "Reform": "Brx"
  "Ref":    "Brx"

# Leader-approval columns that leak into the vote-intention tables on
# Wikipedia's UK polling pages. Not vote shares.
drop:
