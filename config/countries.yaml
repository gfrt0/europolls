    - "GroKo"                       # canonical: Union–SPD
    - "UnionGrüne"
    - "Schwarz-Grün"                # canonical: Union–Grüne
    - "SPD Grüne"
    - "Rot-Grün"                    # canonical: SPD–Grüne
    - "SPD Grüne Linke"
    - "SPDGrüneLinke"
    - "Rot-Rot-Grün"                # canonical: SPD–Grüne–Linke
    - "UnionFDP"
    - "Schwarz-Gelb"                # canonical: Union–FDP
    - "SPD FDP"
    - "Rot-Gelb"                    # canonical: SPD–FDP
    - "SPD Union FDP"
    - "Deutschland"                 # canonical: Union–SPD–FDP
    - "UnionSPDGrüne"
    - "Kenia"                       # canonical: Union–SPD–Grüne
    - "UnionSPDLinke"
    - "UnionAfD"
  wide_parties: [Union, SPD, Grüne, FDP, Linke, AfD, BSW, CSU]
