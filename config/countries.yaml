# Per-country fetch + parse config.
#
# Per country:
#   title_for_cycle: pattern for non-`current` cycle pages. Uses {cycle} placeholder.
#   title_current:   pattern for the "next election" page (`current` cycle).
#   coalition_shorts: party_short labels that are coalition aggregates, not parties.
#   cycles: cycle_id → either
#       year (int)                 — simple case; title built from title_for_cycle
#       {year, title} (mapping)    — explicit title override (for multi-election years etc.)
#
# A cycle whose article doesn't exist on Wikipedia is silently skipped during fetch.

IT:
  title_for_cycle: "Opinion polling for the {cycle} Italian general election"
  title_current:   "Opinion polling for the next Italian general election"
  coalition_shorts: [cdl, cdx, "casa delle libertà", centre-left, centre-right, csx, unione]
  cycles:
    current: 2026
    "2022": 2022
    "2018": 2018
    "2013": 2013
    "2008": 2008
    "2006": 2006

