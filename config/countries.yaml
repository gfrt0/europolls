# Per-country fetch + parse config.
#
# Per country:
#   title_for_cycle: pattern for non-`current` cycle pages. Uses {cycle} placeholder.
#   title_current:   pattern for the "next election" page (`current` cycle).
#   coalition_shorts: party_short labels that are coalition aggregates, not parties.
#   cycles: cycle_id → either
#       year (int)                 — simple case; title built from title_for_cycle
#       {year, title} (mapping)    — explicit title override (for multi-election years etc.)
#
# A cycle whose article doesn't exist on Wikipedia is silently skipped during fetch.

IT:
  title_for_cycle: "Opinion polling for the {cycle} Italian general election"
  title_current:   "Opinion polling for the next Italian general election"
  coalition_shorts:
    - cdl
    - cdx
    - "casa delle libertà"
    - centre-left
    - centre-right
    - csx
    - unione
    - "Coalitions"          # Wikipedia table-section header
    - "A–IV"                # Calenda+Renzi alliance 2022
    - "+E–A"                # +Europa+Azione 2022 list
  cycles:
    current: 2026
    "2022": 2022
    "2018": 2018
    "2013": 2013
    "2008": 2008
    "2006": 2006

DE:
  title_for_cycle: "Opinion polling for the {cycle} German federal election"
  title_current:   "Opinion polling for the next German federal election"
  # Coalition simulation columns. Lists both raw Wikipedia variants (so parse.py
  # tags them) and canonical post-alias names (so build_web.py tags after fold).
  coalition_shorts:
    - "SPD Grüne FDP"
    - "SPDGrüneFDP"
    - "Ampel"                       # canonical: SPD–Grüne–FDP
    - "Union Grüne FDP"
    - "Jamaika"                     # canonical: Union–Grüne–FDP
    - "SPD Union"
    - "UnionSPD"
    - "GroKo"                       # canonical: Union–SPD
    - "UnionGrüne"
    - "Schwarz-Grün"                # canonical: Union–Grüne
    - "SPD Grüne"
    - "Rot-Grün"                    # canonical: SPD–Grüne
    - "SPD Grüne Linke"
    - "SPDGrüneLinke"
    - "Rot-Rot-Grün"                # canonical: SPD–Grüne–Linke
    - "UnionFDP"
    - "Schwarz-Gelb"                # canonical: Union–FDP
    - "SPD FDP"
    - "Rot-Gelb"                    # canonical: SPD–FDP
    - "SPD Union FDP"
    - "Deutschland"                 # canonical: Union–SPD–FDP
    - "UnionSPDGrüne"
    - "Kenia"                       # canonical: Union–SPD–Grüne
    - "UnionSPDLinke"
    - "UnionAfD"
  cycles:
    current: 2026
    "2025": 2025
    "2021": 2021
    "2017": 2017
    "2013": 2013
    "2009": 2009

