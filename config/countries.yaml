DK:
  title_for_cycle: "Opinion polling for the {cycle} Danish general election"
  title_current:   "Opinion polling for the next Danish general election"
  # Bloc politics is constitutional convention in DK; almost every poll
  # publishes Blue (V+O+I+C+K) and Red (A+B+F+Ø) totals.
  coalition_shorts:
    - "Blue"
    - "Red"
    - "Blue   (V+O+I+C+K)"
    - "Red   (A+B+F+Ø)"
    - "Red   (A+B+F+Ø+Å)"
    - "Blocs"
  cycles:
    current: 2026
    "2022": 2022
    "2019": 2019
    "2015": 2015
    "2011": 2011

