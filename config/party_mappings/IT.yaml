# Italian party_short → partyfacts_id mapping.
#
# Built from inspecting the Wikipedia polling-table column headers in
# data/interim/wiki_polls/IT_*.csv against data/raw/partyfacts/core-parties.csv.
# Coverage ~95% of poll-party rows by observation count; long-tail entries
# without a partyfacts_id are left as null.
#
# `coalition: true` flags coalition aggregate columns (CDX, CSX, etc.) so they
# pivot separately from individual-party columns downstream.
#
# `notes` is free text — disambiguation, vintage cutoffs, etc.

