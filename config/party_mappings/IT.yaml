# Italian party_short → partyfacts_id mapping (hand-curated layer).
#
# Originally built from Wikipedia polling-table column headers in
# data/interim/IT_*.csv vs data/raw/partyfacts/core-parties.csv.
# Now in the same list-of-entries shape as the auto-generated YAMLs
# so scripts/party_crosswalk_build.py can co-process IT on rebuild;
# all entries carry source=hand_curated or source=verified_not_in_pf
# so they survive untouched when the auto pipeline reruns.
#
# is_coalition: true flags coalition aggregate columns (CDX, CSX,
# CdL, Unione) so they pivot separately downstream and are collapsed
# only when component party rows appear alongside in the same poll.
#
# notes is free text: disambiguation, vintage cutoffs, etc.

