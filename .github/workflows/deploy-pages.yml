name: deploy-pages

on:
  push:
    branches: [master]
    paths-ignore: ['README.md', 'LICENSE', 'LICENSE-DATA', '.gitignore']
  schedule:
    # Refresh polling data once a week (Mondays 06:00 UTC).
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Build pipeline (fetches all Wikipedia articles)
        run: python scripts/build_all.py

      - name: Build web JSON
        run: python scripts/build_web.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
