name: deploy-pages

on:
  push:
    branches: ['**']
    paths-ignore: ['README.md', 'LICENSE', 'LICENSE-DATA', '.gitignore']
  schedule:
    # Refresh polling data once a week (Mondays 06:00 UTC).
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Per-ref concurrency so a branch build doesn't cancel a master build.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Build pipeline (fetches all Wikipedia articles)
        run: python scripts/build_all.py

      - name: Build web JSON
        run: python scripts/build_web.py

      # Always upload polls_long.csv so we can inspect a branch's data
      # without re-running the pipeline locally. 30-day retention.
      - name: Upload polls_long.csv
        uses: actions/upload-artifact@v4
        with:
          name: polls_long-${{ github.ref_name }}-${{ github.sha }}
          path: data/processed/polls_long.csv
          retention-days: 30

      # Pages artifact + deploy only on master.
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
